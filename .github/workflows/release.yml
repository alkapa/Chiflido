name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej. v0.1.0-rc1). Crea el tag y el release.'
        required: true
        type: string
      prerelease:
        description: 'Marcar como pre-release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build release APK + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$VERSION" =~ ^v ]]; then
            echo "::error::La versión debe empezar con 'v' (recibí: $VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión resuelta: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Si el repo tiene configurados secretos de firma, decodifica el keystore.
      # Si no, el buildType "release" cae al keystore debug (ver app/build.gradle.kts).
      - name: Decode signing keystore
        id: signing
        if: ${{ env.SIGNING_KEYSTORE_BASE64 != '' }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="${{ runner.temp }}/release.keystore"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Stage APK with versioned name
        id: stage
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p out
          src=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          dst="out/chiflido-${VERSION}.apk"
          cp "$src" "$dst"
          echo "apk_path=$dst" >> "$GITHUB_OUTPUT"

      # softprops/action-gh-release crea el tag automáticamente si no existe
      # cuando lo invoca un workflow_dispatch con tag_name explícito.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Chiflido ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(steps.ver.outputs.version, '-') }}
          files: ${{ steps.stage.outputs.apk_path }}
